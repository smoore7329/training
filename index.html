<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AIME Training</title>
<meta name="theme-color" content="#1F3864">
<style>
  :root{
    --navy:#1F3864; --navy-2:#2B4A80; --ink:#1b2230; --muted:#5d6676; --line:#dde2ea; --bg:#f3f5f8; --card:#fff;
    --green:#1e7b45; --green-bg:#e3f4ea; --red:#b42318; --red-bg:#fde8e6; --amber:#9a5b00; --amber-bg:#fff2d6; --blue-bg:#e7eefb;
    --r:12px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;-webkit-text-size-adjust:100%}
  button,input,textarea{font:inherit}
  header{background:var(--navy);color:#fff;padding:14px 16px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:5}
  header .brand{font-weight:800;letter-spacing:.3px}
  header .brand small{font-weight:500;opacity:.75;margin-left:6px}
  header .sp{flex:1}
  header .who{font-size:14px;opacity:.9;text-align:right}
  header button{background:transparent;border:1px solid rgba(255,255,255,.45);color:#fff;border-radius:8px;padding:8px 12px;cursor:pointer}
  nav.tabs{display:flex;gap:6px;padding:10px 16px 0;max-width:980px;margin:0 auto}
  nav.tabs button{border:0;background:transparent;padding:10px 14px;border-bottom:3px solid transparent;color:var(--muted);font-weight:600;cursor:pointer}
  nav.tabs button.on{color:var(--navy);border-color:var(--navy)}
  main{max-width:980px;margin:0 auto;padding:16px 16px 60px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:14px}
  h1{font-size:24px;margin:4px 0 12px} h2{font-size:19px;margin:0 0 10px} h3{font-size:16px;margin:18px 0 6px}
  .muted{color:var(--muted)} .small{font-size:14px}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:10px 18px;border-radius:10px;border:1px solid var(--navy);background:var(--navy);color:#fff;font-weight:600;cursor:pointer;text-decoration:none}
  .btn.ghost{background:#fff;color:var(--navy)}
  .btn.green{background:var(--green);border-color:var(--green)}
  .btn.sm{min-height:38px;padding:6px 12px;font-size:14px}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .pill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:13px;font-weight:600;white-space:nowrap}
  .pill.g{background:var(--green-bg);color:var(--green)} .pill.r{background:var(--red-bg);color:var(--red)}
  .pill.a{background:var(--amber-bg);color:var(--amber)} .pill.b{background:var(--blue-bg);color:var(--navy)} .pill.n{background:#eef0f3;color:var(--muted)}
  .bar{height:10px;background:#e8ebf0;border-radius:99px;overflow:hidden} .bar>i{display:block;height:100%;background:var(--green)}
  .list{border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .item{display:flex;gap:12px;align-items:center;padding:14px;border-top:1px solid var(--line);background:#fff}
  .item:first-child{border-top:0}
  .item .num{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:#eef1f6;font-weight:700;color:var(--navy);flex:none}
  .item .num.done{background:var(--green);color:#fff}
  .item .txt{flex:1;min-width:0}
  .item .txt b{display:block}
  label{display:block;font-weight:600;margin:12px 0 6px}
  input[type=text],input[type=password],input[type=search],textarea{width:100%;padding:14px;border:1px solid #c5ccd8;border-radius:10px;background:#fff;font-size:18px}
  textarea{font-size:16px;min-height:90px}
  .err{background:var(--red-bg);color:var(--red);padding:12px 14px;border-radius:10px;margin:12px 0;font-weight:600}
  .center{min-height:70vh;display:grid;place-items:center}
  .login{width:100%;max-width:420px}
  .lesson h2{font-size:18px;margin:20px 0 8px;color:var(--navy)} .lesson ul,.lesson ol{padding-left:22px} .lesson li{margin:6px 0}
  .q{font-size:20px;font-weight:600;margin:6px 0 16px}
  .choice{display:block;width:100%;text-align:left;padding:16px;margin:10px 0;border:2px solid var(--line);border-radius:12px;background:#fff;cursor:pointer;font-size:17px}
  .choice.on{border-color:var(--navy);background:var(--blue-bg)}
  .crit{color:var(--red);font-weight:700;font-size:14px}
  .result{border-left:4px solid var(--line);padding:10px 12px;margin:10px 0;background:#fff;border-radius:6px}
  .result.ok{border-color:var(--green)} .result.no{border-color:var(--red)}
  .banner{padding:22px;border-radius:var(--r);text-align:center;margin-bottom:14px}
  .banner.pass{background:var(--green-bg);color:var(--green)} .banner.fail{background:var(--red-bg);color:var(--red)}
  .banner .big{font-size:40px;font-weight:800}
  .modal{position:fixed;inset:0;background:rgba(10,20,40,.45);display:grid;place-items:center;padding:16px;z-index:20}
  .modal .card{max-width:560px;width:100%;margin:0}
  table{width:100%;border-collapse:collapse;font-size:14px} th,td{text-align:left;padding:8px;border-bottom:1px solid var(--line);vertical-align:top} th{background:#f0f3f8}
  .spinner{width:28px;height:28px;border:3px solid #c9d2e3;border-top-color:var(--navy);border-radius:50%;animation:spin 1s linear infinite;margin:40px auto}
  @keyframes spin{to{transform:rotate(360deg)}}
  .lesson h3,.doc h3{font-size:16px;margin:16px 0 6px}
  .doc h2{font-size:18px;margin:24px 0 8px;color:var(--navy);padding-top:8px;border-top:1px solid var(--line)}
  .doc h2:first-child{border-top:0;padding-top:0;margin-top:4px}
  .doc ul,.doc ol{padding-left:22px} .doc li{margin:5px 0}
  .tbl{overflow-x:auto;margin:10px 0} .tbl table{min-width:480px}
  .callout{border-left:4px solid var(--navy);background:var(--blue-bg);padding:10px 14px;border-radius:6px;margin:12px 0}
  .callout.warn{border-color:var(--red);background:var(--red-bg)}
  .ackbar{position:sticky;bottom:0;background:#fff;border-top:2px solid var(--line);padding:14px 18px;margin:0 -16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;z-index:4}
  .snippet{font-size:14px;color:var(--muted);margin-top:4px}
  .cat{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin:18px 0 8px}
  .print-only{display:none}
  @media print{
    header,nav.tabs,.no-print{display:none!important} body{background:#fff} main{padding:0;max-width:none} .card{border:0;padding:0} .print-only{display:block}
  }
  @media (max-width:600px){ .item{flex-wrap:wrap} h1{font-size:21px} }
</style>
</head>

    printPdf: "Imprimir / Guardar como PDF", record: "Registro de capacitación del empleado", printed: "Impreso", employee: "Empleado", site: "Sitio", classification: "Clasificación",

    notYetRead: (v) => `Todavía no (leyó la v${v})`, notYet: "Todavía no", attemptLog: "Registro de intentos", score: "Puntaje", pass: "Aprobó", fail: "No aprobó", critMissedShort: " (falló una crítica)",
    reviewedByLead: " · revisado por un lead", noAttempts: "Todavía no hay intentos",
    recordNote: "El sistema de capacitación califica las pruebas y registra la fecha y hora. Las evaluaciones prácticas se registran con el usuario del QC Lead que firma.",

    backLibrary: "← Biblioteca", print: "Imprimir", youAcked: (v, d) => `Usted confirmó la versión ${v} (${d})`, iRead: (v) => `He leído y entiendo este documento (versión ${v}).`,

const LANG_KEY = "aime-training-lang";
const savedLang = () => { try { return localStorage.getItem(LANG_KEY); } catch { return null; } };
let LANG = savedLang() === "es" ? "es" : "en";
const t = (k, ...a) => { const v = I18N[LANG][k] ?? I18N.en[k]; return typeof v === "function" ? v(...a) : v; };
function setLang(l, remember){ LANG = l === "es" ? "es" : "en"; document.documentElement.lang = LANG; if (remember) { try { localStorage.setItem(LANG_KEY, LANG); } catch {} } }
// banner shown on translated content: draft notice if the Spanish exists, "not translated" if it fell back to English
// Library categories are Airtable choices; show the common ones in Spanish
const CAT_ES = { Safety: "Seguridad", Electrical: "Electricidad", "HR & Policies": "Recursos humanos y políticas", Quality: "Calidad", Other: "Otros" };
const catName = (c) => (LANG === "es" && CAT_ES[c]) || c;
const esNote = (translated) => LANG !== "es" ? "" : `<div class="callout" style="font-size:14px">${esc(translated ? t("draftEs") : t("notTranslated"))}</div>`;

// ===== State =====
let S = { token: null, me: null, view: "home", data: null, quiz: null, viewing: null };
const store = { get(k){ try{ return JSON.parse(sessionStorage.getItem(k)); }catch{ return null; } }, set(k,v){ try{ sessionStorage.setItem(k, JSON.stringify(v)); }catch{} }, del(k){ try{ sessionStorage.removeItem(k); }catch{} } };
const $ = (s) => document.querySelector(s);
const app = $("#app");
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pct = (x) => Math.round((x ?? 0) * 100) + "%";
const loc = () => (LANG === "es" ? "es-US" : undefined);
const fmtDate = (d) => d ? new Date(d.length === 10 ? d + "T12:00:00" : d).toLocaleDateString(loc(), { month: "short", day: "numeric", year: "numeric" }) : "";
const fmtDT = (d) => d ? new Date(d).toLocaleString(loc(), { month: "short", day: "numeric", year: "numeric", hour: "numeric", minute: "2-digit" }) : "";
const isLead = () => ["QC Lead", "Admin"].includes(S.me?.role);

async function api(action, payload = {}) {
  const r = await fetch(API_URL, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ action, token: S.token, lang: LANG, ...payload }) });
  const j = await r.json().catch(() => ({ error: t("noResponse") }));
  if (r.status === 401 && action !== "login") { signOut(j.error); throw new Error(j.error); }
  if (!r.ok) throw new Error(j.error || t("wrong"));
  return j;
}
function loading(){ app.innerHTML = '<div class="spinner"></div>'; }
function showErr(e, where = app){ const d = document.createElement("div"); d.className = "err"; d.textContent = e.message || String(e); where.prepend(d); window.scrollTo(0,0); }

// Tiny markdown for lessons and documents: ## / ### headings, - and 1. lists, > callouts, | tables, **bold**, _italic_
function md(src) {
  const inline = (t) => esc(t).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/(^|[\s(])[_*](.+?)[_*](?=[\s.,;:)!?]|$)/g, "$1<i>$2</i>");
  let html = "", list = null;
  const close = () => { if (list) { html += `</${list}>`; list = null; } };
  const lines = String(src || "").split("\n");
  const cellsOf = (l) => l.trim().replace(/^\||\|$/g, "").split("|").map((c) => c.trim());
  for (let i = 0; i < lines.length; i++) {
    const l = lines[i].trimEnd();
    let m;
    if (!l.trim()) { close(); continue; }
    if (l.trim().startsWith("|")) {
      close(); const rows = [];
      while (i < lines.length && lines[i].trim().startsWith("|")) { if (!/^\|[\s\-:|]+\|$/.test(lines[i].trim())) rows.push(cellsOf(lines[i])); i++; }
      i--;
      html += `<div class="tbl"><table><tr>${rows[0].map((c) => `<th>${inline(c)}</th>`).join("")}</tr>${rows.slice(1).map((r) => `<tr>${r.map((c) => `<td>${inline(c)}</td>`).join("")}</tr>`).join("")}</table></div>`;
      continue;
    }
    if ((m = l.match(/^>\s?(.*)/))) { close(); html += `<div class="callout ${/FAIL|IMPORTANT|WARNING|DANGER|IMPORTANTE|ADVERTENCIA|PELIGRO/.test(m[1]) ? "warn" : ""}">${inline(m[1])}</div>`; continue; }
    if ((m = l.match(/^###\s+(.*)/))) { close(); html += `<h3>${inline(m[1])}</h3>`; }
    else if ((m = l.match(/^#{1,2}\s+(.*)/))) { close(); html += `<h2>${inline(m[1])}</h2>`; }
    else if ((m = l.match(/^(\s*)[-*]\s+(.*)/))) {
      // an indented bullet under another bullet becomes a nested list item
      const sub = m[1].length >= 2 && list === "ul";
      if (!sub && list !== "ul") { close(); html += "<ul>"; list = "ul"; }
      html += `<li${sub ? ' style="margin-left:22px;list-style:circle"' : ""}>${inline(m[2])}</li>`;
    }
    else if ((m = l.match(/^\s*(\d+)[.)]\s+(.*)/))) {
      // keep the manual's numbering when a numbered list is split by a note or sub-list
      if (list !== "ol") { close(); const n = parseInt(m[1], 10); html += n > 1 ? `<ol start="${n}">` : "<ol>"; list = "ol"; }
      html += `<li>${inline(m[2])}</li>`;
    }
    else { close(); html += `<p>${inline(l)}</p>`; }
  }
  close(); return html;
}

function statusPill(s){ return s === "Qualified" ? `<span class="pill g">${t("qualified")}</span>` : s === "In Training" ? `<span class="pill a">${t("inTraining")}</span>` : s === "Expired" ? `<span class="pill r">${t("expired")}</span>` : `<span class="pill n">${t("notStarted")}</span>`; }
const statusText = (s) => ({ Qualified: t("qualified"), "In Training": t("inTraining"), Expired: t("expired"), "Not Started": t("notStarted") }[s] ?? s);

function courseHTML(c, opts){
  const total = c.modules.length + c.practical.length;
  const done = c.modules.filter((m) => m.passed).length + c.practical.filter((p) => p.signed).length;
  const mods = c.modules.map((m, i) => {
    let st, action = "";
    if (m.passed) st = `<span class="pill g">${t("passedPct", pct(m.passedScore))}</span> <span class="small muted">${fmtDate(m.passedDate)}</span>`;
    else if (m.locked) st = `<span class="pill r">${t("lockedFails", m.failsSinceReview)}</span>`;
    else if (m.attempts) st = `<span class="pill a">${t("notPassedYet")}</span> <span class="small muted">${t("bestLeft", pct(m.best), m.maxAttempts - m.failsSinceReview)}</span>`;
    else st = `<span class="pill n">${t("notStarted")}</span>`;
    if (opts.self && !m.locked) action = `<button class="btn sm ${m.passed ? "ghost" : ""}" data-lesson="${m.id}">${m.passed ? t("review") : m.attempts ? t("tryAgain") : t("start")}</button>`;
    if (opts.lead && m.locked) action = `<button class="btn sm" data-unlock="${m.id}">${t("unlock")}</button>`;
    return `<div class="item"><div class="num ${m.passed ? "done" : ""}">${m.passed ? "✓" : i + 1}</div><div class="txt"><b>${esc(m.name)}</b><div>${st}</div></div>${action}</div>`;
  }).join("");
  const pr = c.practical.map((p) => {
    const st = p.signed ? `<span class="pill g">${t("signedOff")}</span> <span class="small muted">${esc(p.signedBy)} · ${fmtDate(p.signedAt)}</span>` : `<span class="pill n">${t("waitingLead")}</span>`;
    const action = opts.lead && !p.signed ? `<button class="btn sm" data-sign="${p.id}">${t("signOffBtn")}</button>` : "";
    return `<div class="item"><div class="num ${p.signed ? "done" : ""}">${p.signed ? "✓" : esc(p.code)}</div><div class="txt"><b>${esc(p.task)}</b><div class="small muted">${esc(p.confirms)}</div><div>${st}</div></div>${action}</div>`;
  }).join("");
  return `<div class="card">
    <div class="row" style="justify-content:space-between"><h2 style="margin:0">${esc(c.name)}</h2><span>${c.required === false ? `<span class="pill b" title="${esc(t("optionalHelp"))}">${t("optional")}</span> ` : ""}${statusPill(c.status)}</span></div>
    ${c.required === false && opts.self ? `<p class="small muted" style="margin:6px 0 0">${t("optionalHelp")}</p>` : ""}
    ${c.status === "Qualified" ? `<p class="small" style="color:var(--green);font-weight:600">${t("qualifiedOn", fmtDate(c.qualifiedDate), c.expires ? fmtDate(c.expires) : "")}</p>` : ""}
    <div class="row small muted" style="margin:10px 0 6px"><span>${t("nOfComplete", done, total)}</span></div>
    <div class="bar"><i style="width:${total ? done / total * 100 : 0}%"></i></div>
    <h3>${t("lessonsQuizzes")}</h3><div class="list">${mods}</div>
    ${c.practical.length ? `<h3>${t("handsOn")}</h3><p class="small muted" style="margin-top:0">${t("handsOnHelp")}</p><div class="list">${pr}</div>` : ""}
  </div>`;
}

function drawQuestion(){
  const Q = S.quiz, q = Q.questions[Q.i], n = Q.questions.length;
  const answered = Object.keys(Q.answers).length;
  app.innerHTML = `<div class="card">
    <div class="row small muted" style="justify-content:space-between"><span>${esc(Q.module.name)}</span><span>${t("questionNofM", Q.i + 1, n)}</span></div>
    <div class="bar" style="margin:10px 0 16px"><i style="width:${(Q.i + 1) / n * 100}%;background:var(--navy)"></i></div>
    ${LANG === "es" && !q.translated ? esNote(false) : ""}
    ${q.critical ? `<div class="crit">${t("critQ")}</div>` : ""}
    <div class="q">${esc(q.text)}</div>
    ${q.choices.map((c) => `<button class="choice ${Q.answers[q.id] === c.key ? "on" : ""}" data-k="${c.key}">${esc(c.text)}</button>`).join("")}
    <div class="row" style="justify-content:space-between;margin-top:16px">
      <button class="btn ghost" id="prev" ${Q.i === 0 ? "disabled" : ""}>${t("prev")}</button>
      ${Q.i < n - 1 ? `<button class="btn" id="next" ${Q.answers[q.id] ? "" : "disabled"}>${t("next")}</button>` : `<button class="btn green" id="sub">${t("submit", answered, n)}</button>`}
    </div></div>`;
  app.querySelectorAll(".choice").forEach((b) => b.onclick = () => { Q.answers[q.id] = b.dataset.k; drawQuestion(); });
  $("#prev").onclick = () => { Q.i--; drawQuestion(); };
  if ($("#next")) $("#next").onclick = () => { Q.i++; drawQuestion(); };
  if ($("#sub")) $("#sub").onclick = submitQuiz;
}

          <table><tr><th>${t("document")}</th><th>${t("version")}</th><th>${t("acknowledged")}</th></tr>
          ${d.documents.map((x) => `<tr><td>${esc(x.title)}</td><td>${esc(x.version)}</td><td>${x.current ? fmtDT(x.acknowledgedAt) : x.previousVersion ? esc(t("notYetRead", x.previousVersion)) : t("notYet")}</td></tr>`).join("")}</table>` : ""}
        <h3 style="margin-top:20px">${t("attemptLog")}</h3>
        <table><tr><th>${t("date")}</th><th>${t("module")}</th><th>${t("score")}</th><th>${t("result")}</th></tr>
        ${hist.map((h) => `<tr><td>${fmtDT(h.submitted)}</td><td>${esc(modName[h.module] || "")}</td><td>${h.correct}/${h.total} (${pct(h.score)})</td><td>${h.passed ? t("pass") : t("fail") + (h.criticalMissed ? t("critMissedShort") : "")}${h.reviewed ? t("reviewedByLead") : ""}</td></tr>`).join("") || `<tr><td colspan="4" class="muted">${t("noAttempts")}</td></tr>`}</table>
        <p class="small muted" style="margin-top:16px">${t("recordNote")}</p>
      </div>`;
    $("#back").onclick = () => go(empId === S.me.id ? "home" : "trainee", empId);
  } catch (e) { app.innerHTML = ""; showErr(e); }
}

// ===== Library =====
function ackPill(x){
  if (!x.ackRequired) return "";
  if (x.current) return `<span class="pill g">${t("ackd")}</span>`;
  if (x.previousVersion) return `<span class="pill a">${t("reAck")}</span>`;
  return `<span class="pill r">${t("mustRead")}</span>`;
}
function docsCard(list, self){
  if (!list?.length) return "";
  const open = list.filter((x) => !x.current).length;
  if (self && !open) return "";
  return `<div class="card"><div class="row" style="justify-content:space-between"><h2 style="margin:0">${self ? t("toRead") : t("requiredReading")}</h2>
      <span class="small muted">${t("nOfAck", list.length - open, list.length)}</span></div>
    <p class="small muted" style="margin:6px 0 10px">${self ? t("toReadHelp") : t("reqHelp")}</p>
    <div class="list">${(self ? list.filter((x) => !x.current) : list).map((x) => `<div class="item"><div class="txt"><b>${esc(x.title)}</b><span class="small muted">v${esc(x.version)} · ${esc(catName(x.category))}</span>
      <div>${ackPill(x)} ${x.current ? `<span class="small muted">${fmtDate(x.acknowledgedAt)}</span>` : ""}</div></div>
      ${self ? `<button class="btn sm" data-doc="${x.id}">${t("read")}</button>` : ""}</div>`).join("")}</div></div>`;
}

async function library(q = ""){
  if (!q) loading();
  try {
    const docs = await api("library", { q });
    const groups = {};
    docs.forEach((d) => (groups[d.category] ??= []).push(d));
    const body = docs.length ? Object.entries(groups).map(([cat, ds]) => `<div class="cat">${esc(catName(cat))}</div><div class="list">${ds.map((d) => `
        <div class="item" data-doc="${d.id}" style="cursor:pointer"><div class="num">📄</div><div class="txt"><b>${esc(d.title)}</b>
          <span class="small muted">v${esc(d.version)}${d.effective ? " · " + t("effective") + " " + fmtDate(d.effective) : ""}${d.leadsOnly ? " · " + t("leadsOnly") : ""}</span>
          ${d.snippet ? `<div class="snippet">${esc(d.snippet)}</div>` : d.summary ? `<div class="snippet">${esc(d.summary)}</div>` : ""}</div>${ackPill(d)}</div>`).join("")}</div>`).join("")
      : `<div class="card muted">${q.trim() ? esc(t("nothingMatches", q)) : t("noDocs")}</div>`;
    if (q && $("#libres")) { $("#libres").innerHTML = body; bindDocs(); return; }
    app.innerHTML = `<h1>${t("libraryTitle")}</h1><p class="muted" style="margin-top:-6px">${t("libraryHelp")}</p>
      <input type="search" id="lq" placeholder="${esc(t("libSearch"))}" value="${esc(q)}"><div id="libres">${body}</div>`;
    let tm; $("#lq").oninput = (e) => { clearTimeout(tm); tm = setTimeout(() => library(e.target.value.trim() || " "), 350); };
    bindDocs();
  } catch (e) { app.innerHTML = ""; showErr(e); }
}
function bindDocs(){ app.querySelectorAll("[data-doc]").forEach((el) => el.onclick = () => go("doc", el.dataset.doc)); }

async function docView(id, pre){
  if (!pre) loading();
  try {
    const d = pre || await api("document", { documentId: id });
    const ack = !d.ackRequired ? "" : d.current
      ? `<div class="ackbar"><span class="pill g">✓ ${t("ackd")}</span><span class="small">${esc(t("youAcked", d.version, fmtDT(d.acknowledgedAt)))}</span></div>`
      : `<div class="ackbar no-print"><label style="display:flex;gap:10px;align-items:center;margin:0;font-weight:600;flex:1;min-width:220px"><input type="checkbox" id="ackck" style="width:26px;height:26px;flex:none">${esc(t("iRead", d.version))}</label>
          <button class="btn green" id="ackbtn" disabled>${t("ackBtn")}</button></div>`;
    app.innerHTML = `<div class="row no-print" style="margin-bottom:10px"><button class="btn ghost sm" id="back">${t("backLibrary")}</button><button class="btn ghost sm" onclick="print()">${t("print")}</button>
        ${d.files.map((f) => `<a class="btn ghost sm" href="${esc(f.url)}" target="_blank" rel="noopener">⬇ ${esc(f.filename)}</a>`).join("")}</div>
      <div class="card doc">
        <div class="small muted">${esc(catName(d.category))}</div><h1 style="margin-bottom:4px">${esc(d.title)}</h1>
        <div class="row small muted" style="margin-bottom:8px"><span>${t("version")} ${esc(d.version)}</span>${d.effective ? `<span>· ${t("effectiveCap")} ${fmtDate(d.effective)}</span>` : ""} ${ackPill(d)}</div>
        ${esNote(d.translated)}
        ${d.previousVersion && !d.current ? `<div class="callout">${esc(t("updatedSince", d.previousVersion))}${d.revisionNotes ? esc(t("whatChanged")) + esc(d.revisionNotes) : ""}</div>` : ""}
        ${d.modules?.length ? `<p class="small">${t("usedIn")}${d.modules.map((m) => esc(m.name)).join(", ")}</p>` : ""}
        ${md(d.content)}
        ${ack}
      </div>`;
    $("#back").onclick = () => go("library");
    if ($("#ackck")) {
      $("#ackck").onchange = (e) => $("#ackbtn").disabled = !e.target.checked;
      $("#ackbtn").onclick = async (e) => { e.target.disabled = true; try { docView(id, await api("acknowledge", { documentId: id })); } catch (err) { showErr(err); e.target.disabled = false; } };
    }
  } catch (e) { app.innerHTML = `<div class="row"><button class="btn ghost sm" id="back">${t("backLibrary")}</button></div>`; $("#back").onclick = () => go("library"); showErr(e); }
}

// ===== Start =====
setLang(LANG);
const saved = store.get("session");
if (saved?.token) { S.token = saved.token; S.me = saved.me; bumpIdle(); go("home"); } else { renderHeader(); renderLogin(); }
</script>
</body>
